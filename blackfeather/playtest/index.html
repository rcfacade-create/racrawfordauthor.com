<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c10"><title>Blackfeather Human Playtest</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../playtest.css"></head><body><header class="pt-head"><a href="../" class="pt-brand">BLACKFEATHER</a><span>Human Playtest · v0.4.2</span></header><main class="pt-wrap"><section id="setup" class="panel"><p class="eyebrow">Foundation Set I</p><h1>Human Playtest</h1><p>Choose two Houses and play a first-to-three match. Results are stored on this device and can be exported as CSV.</p><div class="setup-grid"><label>Your House<select id="playerHouse"></select></label><label>Opponent<select id="aiHouse"></select></label></div><button id="start" class="primary">Start Match</button></section><section id="game" class="hidden"><div class="score"><div>You <b id="ps">0</b></div><div>Clash <b id="clash">1</b></div><div><b id="os">0</b> Opponent</div></div><div class="phase" id="phase">Choose a Legend to lead.</div><div class="board"><div><h3>Opponent</h3><div id="oppLine" class="line"></div></div><div><h3>Your Field</h3><div id="yourLine" class="line"></div></div></div><div class="actions"><button id="ability">Use Legend Ability</button><button id="event">Play Best Event</button><button id="resolve" class="primary">Resolve Clash</button></div><h3>Your Hand</h3><div id="hand" class="cards"></div><pre id="log" class="log"></pre></section><section id="result" class="panel hidden"><h2>Record Playtest</h2><div id="resultSummary"></div><div class="form-grid"><label>Winner<select id="winner"><option>Player</option><option>Opponent</option></select></label><label>Match feel<select id="feel"><option>Close / interactive</option><option>One-sided</option><option>Confusing timing</option><option>Too slow</option><option>Too swingy</option></select></label><label class="wide">Decisive card / ability<input id="decisive" placeholder="e.g. Crow Spy, Betrayal"></label><label class="wide">Notes<textarea id="notes" placeholder="What felt strong, weak, confusing, fun, or unfair?"></textarea></label></div><div class="actions"><button id="save" class="primary">Save Playtest</button><button id="again">Play Again</button><button id="export">Export CSV</button></div><pre id="history" class="log"></pre></section></main><script src="../playtest-data.js"></script><script src="../playtest.js"></script></body></html>
