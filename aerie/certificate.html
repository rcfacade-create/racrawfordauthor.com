<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blank Trial Certificate | The Aerie Dominion</title>
  <meta name="description" content="Download or print a blank Trial of the Houses certificate from Aethelmar Academy." />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="aerie.css?v=20261006-2" />
  <style>
    .certificate-page{padding:7rem 1rem 3rem;text-align:center}
    .certificate-toolbar{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;align-items:center;margin:1.5rem auto 2rem}
    .certificate-toolbar label{color:#e7dac2}
    .certificate-toolbar select{padding:.78rem 1rem;border:1px solid rgba(200,163,90,.5);background:#111014;color:#f8f2e8;font:inherit}
    .certificate-stage{width:min(1180px,100%);margin:auto;background:#0b0a0b;padding:14px;box-shadow:0 18px 54px rgba(0,0,0,.55)}
    .certificate-stage svg{display:block;width:100%;height:auto;background:#ead6ad}
    .certificate-note{max-width:900px;margin:1rem auto;color:#cbbca5}
    @media print{
      @page{size:A4 landscape;margin:0}
      body{background:#fff}
      .aerie-top-nav,.certificate-toolbar,.certificate-page>p,.certificate-page>h1{display:none!important}
      .certificate-page{padding:0}.certificate-stage{padding:0;box-shadow:none;width:100%}
      .certificate-stage svg{width:297mm;height:210mm}
    }
  </style>
  <link rel="canonical" href="https://racrawfordauthor.com/aerie/certificate.html" />
</head>
<body class="aerie-page">
  <header class="aerie-top-nav">
    <a class="aerie-brand" href="index.html">The Aerie Dominion</a>
    <nav class="aerie-main-nav" aria-label="Aerie main navigation">
      <a href="../index.html">Main Site</a><a href="index.html">Gates</a><a href="academy.html">Courtyard</a><a href="trial.html">Trial</a>
    </nav>
  </header>
  <main class="certificate-page">
    <p class="aerie-kicker">Aethelmar Academy Record Office</p>
    <h1>Blank Trial Certificate</h1>
    <p class="certificate-note">This is the engraved Project Avis certificate style. Choose a House, then download the scalable artwork or print it at A4 landscape.</p>
    <div class="certificate-toolbar">
      <label for="blank-house">House:</label>
      <select id="blank-house"><option>Crow</option><option>Owl</option><option>Hawk</option><option>Falcon</option><option>Swan</option><option>Raven</option></select>
      <button class="aerie-button" id="download-blank" type="button">Download Blank Certificate</button>
      <button class="aerie-button aerie-button-secondary" id="print-blank" type="button">Print / Save as PDF</button>
      <a class="aerie-button aerie-button-secondary" href="trial.html?v=20261006-2">Return to the Trial</a>
    </div>
    <section class="certificate-stage" id="certificate-stage" aria-label="Blank Trial of the Houses certificate"></section>
  </main>
<script src="../house-journey.js?v=20261008"></script>
<script src="../house-rewards.js?v=20261008"></script>
<script src="../analytics.js?v=20261008"></script>
<script>
const select = document.getElementById("blank-house"), stage = document.getElementById("certificate-stage");
const chosen = window.ProjectAvisJourney.getHouse();
if (chosen) select.value = chosen;
async function refresh() {
  try { stage.innerHTML = await window.ProjectAvisRewards.buildCertificateSvg("", select.value, ""); }
  catch (_) { stage.textContent = "Unable to load certificate artwork. Please try again."; }
}
select.addEventListener("change", refresh);
document.getElementById("download-blank").addEventListener("click", async () => {
  try {
    const svg = await window.ProjectAvisRewards.buildCertificateSvg("", select.value, "");
    window.ProjectAvisRewards.downloadSvg(svg, "trial-of-the-houses-" + select.value.toLowerCase() + "-blank-certificate.svg");
    document.dispatchEvent(new CustomEvent("projectAvis:rewardDownload", {detail:{reward:"blank_certificate",house:select.value}}));
  } catch (_) { stage.textContent = "Unable to download certificate. Please try again."; }
});
document.getElementById("print-blank").addEventListener("click", () => { window.print();
  document.dispatchEvent(new CustomEvent("projectAvis:rewardPrint", {detail:{reward:"blank_certificate",house:select.value}}));
});
refresh();
</script>
</body></html>
